name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}".TrimStart('v')
            if ($tag -ne $v) { throw "Tag $tag does not match Cargo.toml version $v" }
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo test --release --locked

      - name: Validate generated configs with the real cores
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tmp = "$env:RUNNER_TEMP\cores"; New-Item -ItemType Directory -Force $tmp | Out-Null
          Invoke-WebRequest https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip -OutFile "$tmp\xray.zip"
          Expand-Archive "$tmp\xray.zip" "$tmp\xray" -Force
          $tag = (gh release view --repo SagerNet/sing-box --json tagName -q .tagName).TrimStart('v')
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/releases/download/v$tag/sing-box-$tag-windows-amd64.zip" -OutFile "$tmp\sb.zip"
          Expand-Archive "$tmp\sb.zip" "$tmp\sb" -Force
          $sb = (Get-ChildItem "$tmp\sb" -Recurse -Filter sing-box.exe).FullName
          $env:XRAY_LOCATION_ASSET = "$tmp\xray"
          $bad = 0
          foreach ($f in Get-ChildItem target/xray-configs/*.json) {
            & "$tmp\xray\xray.exe" run -test -c $f.FullName | Out-Null
            if ($LASTEXITCODE -ne 0) { Write-Host "xray rejected $($f.Name)"; $bad++ }
          }
          foreach ($f in Get-ChildItem target/singbox-configs/*.json) {
            & $sb check -c $f.FullName
            if ($LASTEXITCODE -ne 0) { Write-Host "sing-box rejected $($f.Name)"; $bad++ }
          }
          if ($bad -gt 0) { throw "$bad generated configs were rejected" }

      - name: Build
        run: cargo build --release --locked

      - name: MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          New-Item -ItemType Directory -Force dist | Out-Null
          wix build packaging/uplinx.wxs -arch x64 -d Version=${{ steps.v.outputs.version }} -o dist/Uplinx-${{ steps.v.outputs.version }}.msi

      - name: Portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $dir = "dist/portable/Uplinx"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/uplinx.exe "$dir/Uplinx.exe"
          Set-Content "$dir/portable.txt" "Settings are kept in %APPDATA%\Uplinx. Delete this file to stop self-updating as a portable copy."
          Compress-Archive -Path $dir -DestinationPath "dist/Uplinx-$v-portable-win64.zip" -Force
          Remove-Item -Recurse dist/portable
          Remove-Item dist/*.wixpdb -ErrorAction SilentlyContinue
          Get-ChildItem dist -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content dist/SHA256SUMS.txt
          Get-ChildItem dist

      - uses: actions/upload-artifact@v5
        with:
          name: uplinx-${{ steps.v.outputs.version }}
          path: dist/*

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Uplinx ${{ steps.v.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: dist/*
