name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}".TrimStart('v')
            if ($tag -ne $v) { throw "Tag $tag does not match Cargo.toml version $v" }
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          New-Item -ItemType Directory -Force dist | Out-Null
          wix build packaging/uplinx.wxs -arch x64 -d Version=${{ steps.v.outputs.version }} -o dist/Uplinx-${{ steps.v.outputs.version }}.msi

      - name: Portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $dir = "dist/portable/Uplinx"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/uplinx.exe "$dir/Uplinx.exe"
          Set-Content "$dir/portable.txt" "Settings are kept in %APPDATA%\Uplinx. Delete this file to stop self-updating as a portable copy."
          Compress-Archive -Path $dir -DestinationPath "dist/Uplinx-$v-portable-win64.zip" -Force
          Remove-Item -Recurse dist/portable
          Remove-Item dist/*.wixpdb -ErrorAction SilentlyContinue
          Get-ChildItem dist -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content dist/SHA256SUMS.txt
          Get-ChildItem dist

      - uses: actions/upload-artifact@v5
        with:
          name: uplinx-${{ steps.v.outputs.version }}
          path: dist/*

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Uplinx ${{ steps.v.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: dist/*
